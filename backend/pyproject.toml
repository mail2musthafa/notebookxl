[project]
name = "notebookxl-backend"
version = "0.1.0"
description = "NotebookXL FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-jose>=3.3.0",
  "passlib[bcrypt]>=1.7.4"
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
